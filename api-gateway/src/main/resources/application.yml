server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: auth
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
        - id: flood
          uri: lb://flood-service
          predicates:
            - Path=/api/floods/**
        - id: drought
          uri: lb://drought-service
          predicates:
            - Path=/api/droughts/**
        - id: fire
          uri: lb://fire-service
          predicates:
            - Path=/api/fires/**
        - id: zoonotic
          uri: lb://zoonotic-disease-service
          predicates:
            - Path=/api/zoonotic/**
        - id: mining
          uri: lb://mining-accident-service
          predicates:
            - Path=/api/mining/**
        - id: report
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**
        - id: dashboard
          uri: lb://dashboard-service
          predicates:
            - Path=/api/dashboard/**
        - id: alerts
          uri: lb://alert-service
          predicates:
            - Path=/api/alerts/**
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway