server:
  port: 8087
spring:
  application:
    name: report-service
  datasource:
    url: jdbc:postgresql://localhost:5432/report_db
    username: dpdms
    password: dpdms
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics